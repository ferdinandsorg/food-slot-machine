<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passt das?</title>
<style>
  @font-face { font-family: 'Uncut Sans'; src: url('/font.ttf') format('truetype'); font-weight: 300 800; }
  :root {
    --bg-top: #B7A9D6; --bg-bottom: #1E1729; --accent: #8B5CF6; --no: #E5484D;
    --text: #F6F2FB; --muted: rgba(246, 242, 251, 0.66); --card: #F7F4FB; --ink: #1E1729;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: 'Uncut Sans', system-ui, sans-serif; font-feature-settings: 'ss02';
    background: linear-gradient(to bottom, var(--bg-top), #5B4A7A 48%, var(--bg-bottom));
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px; overflow-x: hidden;
  }
  h1 { font-size: 22px; font-weight: 700; text-transform: uppercase; margin: 0 0 4px; }
  .progress { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .bar { width: min(420px, 100%); height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); margin: 8px auto 0; }
  .bar span { display: block; height: 100%; border-radius: 2px; background: var(--text); transition: width .2s; }
  .stage { position: relative; width: min(420px, 100%); }
  .card {
    background: var(--card); color: var(--ink); border-radius: 28px; padding: 24px 16px 20px;
    box-shadow: 0 24px 60px rgba(30, 23, 41, .45); touch-action: pan-y; user-select: none; cursor: grab;
    transition: transform .25s ease, opacity .25s ease;
  }
  .card.dragging { transition: none; cursor: grabbing; }
  .foods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .food img, .food .emoji { width: 88px; height: 88px; object-fit: contain; display: block; margin: 0 auto 8px; pointer-events: none; }
  .food .emoji { font-size: 64px; line-height: 88px; }
  .food .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #7A6F8C; }
  .food .name { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .food.context { opacity: .35; }
  .reasons { margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid #E4DEEC; list-style: none; font-size: 13px; color: #5E5470; }
  .reasons li + li { margin-top: 6px; }
  .stamp { position: absolute; top: 20px; padding: 4px 12px; border: 3px solid; border-radius: 10px; font-weight: 800; font-size: 22px; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
  .stamp.yes { left: 20px; color: var(--accent); }
  .stamp.no { right: 20px; color: var(--no); transform: rotate(12deg); }
  .buttons { display: flex; justify-content: center; gap: 32px; margin-top: 28px; }
  .buttons button {
    width: 76px; height: 76px; border-radius: 50%; border: 0; font-size: 32px; cursor: pointer; color: #fff;
    box-shadow: 0 10px 24px rgba(30, 23, 41, .4); transition: transform .1s;
  }
  .buttons button:active { transform: scale(.94); }
  #no { background: var(--no); }
  #yes { background: var(--accent); }
  .caption { display: flex; justify-content: center; gap: 32px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .caption span { width: 76px; text-align: center; }
  .undo { margin-top: 24px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; }
  .undo:disabled { opacity: .3; cursor: default; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  .done { text-align: center; font-size: 18px; padding: 40px 0; }
</style>
</head>
<body>
  <h1>Passt das?</h1>
  <div class="progress" id="progress">…<div class="bar"><span id="bar" style="width:0"></span></div></div>

  <div class="stage" id="stage"></div>

  <div class="buttons" id="buttons">
    <button id="no" aria-label="Nein, geht nicht">✕</button>
    <button id="yes" aria-label="Ja, geht">✓</button>
  </div>
  <div class="caption"><span>geht nicht</span><span>geht</span></div>
  <button class="undo" id="undo" disabled>Rückgängig</button>
  <p class="hint">Tastatur: ← nein · → ja · ⌫ rückgängig · Karte wischen geht auch</p>

<script>
  const LABELS = { carbs: 'Kohlenhydrate', protein: 'Protein', fiber: 'Ballaststoffe' };
  const stage = document.getElementById('stage');
  const undoBtn = document.getElementById('undo');
  let current = null;
  let busy = false;
  let history = 0;

  function food(slot, f) {
    const art = f.image
      ? `<img src="/img/${f.image}.webp" alt="" onerror="this.outerHTML='<div class=emoji>${f.emoji ?? '🍽️'}</div>'">`
      : `<div class="emoji">${f.emoji ?? '🍽️'}</div>`;
    return `<div class="food${f.inPair ? '' : ' context'}">${art}<div class="label">${LABELS[slot]}</div><div class="name">${f.name}</div></div>`;
  }

  function render(data) {
    current = data.pair;
    document.getElementById('progress').firstChild.textContent =
      `${data.reviewed} von ${data.total} Paaren bewertet · blass = nur Beispiel`;
    document.getElementById('bar').style.width = `${(data.reviewed / data.total) * 100}%`;
    undoBtn.disabled = history === 0;
    if (!current) {
      stage.innerHTML = '<div class="done">Fertig – alles bewertet. 🎉</div>';
      document.getElementById('buttons').style.display = 'none';
      return;
    }
    stage.innerHTML = `
      <div class="card" id="card">
        <div class="stamp yes" id="stampYes">GEHT</div>
        <div class="stamp no" id="stampNo">NÖ</div>
        <div class="foods">${food('carbs', data.meal.carbs)}${food('protein', data.meal.protein)}${food('fiber', data.meal.fiber)}</div>
        <ul class="reasons">${data.reasons.map((r) => `<li>${r}</li>`).join('')}</ul>
      </div>`;
    attachDrag(document.getElementById('card'));
  }

  async function call(path, body) {
    const res = await fetch(path, body ? { method: 'POST', body: JSON.stringify(body) } : { method: path === '/api/next' ? 'GET' : 'POST' });
    return res.json();
  }

  async function decide(verdict) {
    if (!current || busy) return;
    busy = true;
    const card = document.getElementById('card');
    card.style.transform = `translateX(${verdict === 'ja' ? 140 : -140}%) rotate(${verdict === 'ja' ? 18 : -18}deg)`;
    card.style.opacity = '0';
    const data = await call('/api/verdict', {
      a: current.a, b: current.b, verdict,
    });
    history++;
    setTimeout(() => { render(data); busy = false; }, 180);
  }

  async function undo() {
    if (history === 0 || busy) return;
    history--;
    render(await call('/api/undo'));
    document.getElementById('buttons').style.display = '';
  }

  function attachDrag(card) {
    let startX = null;
    const yes = document.getElementById('stampYes');
    const no = document.getElementById('stampNo');
    card.addEventListener('pointerdown', (e) => { startX = e.clientX; card.setPointerCapture(e.pointerId); card.classList.add('dragging'); });
    card.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      yes.style.opacity = Math.max(0, dx / 120);
      no.style.opacity = Math.max(0, -dx / 120);
    });
    card.addEventListener('pointerup', (e) => {
      const dx = e.clientX - startX;
      startX = null;
      card.classList.remove('dragging');
      if (Math.abs(dx) > 110) return decide(dx > 0 ? 'ja' : 'nein');
      card.style.transform = '';
      yes.style.opacity = no.style.opacity = 0;
    });
  }

  document.getElementById('yes').onclick = () => decide('ja');
  document.getElementById('no').onclick = () => decide('nein');
  undoBtn.onclick = undo;
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') decide('ja');
    if (e.key === 'ArrowLeft') decide('nein');
    if (e.key === 'Backspace') undo();
  });

  call('/api/next').then(render);
</script>
</body>
</html>
