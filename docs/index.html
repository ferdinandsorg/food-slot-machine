<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Slot Machine</title>

<meta property="og:title" content="Food Slot Machine">
<meta property="og:description" content="Keine Idee fürs Essen? Dreh am Automaten: drei Zutaten, eine vegetarische Mahlzeit.">
<meta property="og:image" content="https://ferdinands.org/foodslot/assets/social.jpg?v=2">
<meta property="og:image:secure_url" content="https://ferdinands.org/foodslot/assets/social.jpg?v=2">

<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  @font-face { font-family: 'Uncut Sans'; src: url('assets/UncutSans-Variable.ttf') format('truetype'); font-weight: 300 800; font-display: swap; }
  :root {
    --bg-top: #B7A9D6; --bg-mid: #6C5E8F; --bg-bottom: #1E1729;
    --accent: #8B5CF6; --accent-light: #BBA6FF;
    --text: #F6F2FB; --muted: rgba(246, 242, 251, 0.66); --ink: #1D1826;
    --inset: #15101D; --reel-face: #F2EEF7;
    /* Machine width: 420px, shrinking with the viewport (16px gutters) and on short screens.
       Every inner size is a multiple of --u, so the whole machine scales as one piece. */
    --w: max(260px, min(420px, calc(100vw - 32px), calc((100vh - 330px) * 1.25)));
    --u: calc(var(--w) / 420);
    --reel-h: calc(var(--u) * 196);
    /* Strip pitch is a bit taller than the window (iOS: 244 / 231), so neighbours stay hidden. */
    --pitch: calc(var(--reel-h) * 244 / 231);
  }
  @supports (height: 100svh) { :root { --w: max(260px, min(420px, calc(100vw - 32px), calc((100svh - 330px) * 1.25))); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 16px 32px; color: var(--text);
    font-family: 'Uncut Sans', system-ui, sans-serif; font-feature-settings: 'ss02';
    background:
      radial-gradient(ellipse 90% 60% at 20% 8%, rgba(236,226,255,0.55) 0%, rgba(236,226,255,0) 70%),
      radial-gradient(ellipse 120% 70% at 50% 110%, rgba(10,6,16,0.75) 0%, rgba(10,6,16,0) 65%),
      linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    -webkit-user-select: none; user-select: none;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 28px; flex: 1; justify-content: center; width: 100%; }

  /* Cabinet: rounded lilac metal block lit from above. */
  .cabinet {
    width: var(--w); padding: calc(var(--u) * 9); border-radius: calc(var(--u) * 32); cursor: pointer;
    background: linear-gradient(to bottom, #F3EFF8 0%, #CFC7DC 22%, #A79DBA 60%, #7D7393 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 24px 60px rgba(14, 9, 22, 0.55), 0 0 0 0 rgba(139, 92, 246, 0);
    transition: box-shadow 0.5s ease;
  }
  .cabinet.glow { box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 24px 60px rgba(14, 9, 22, 0.55), 0 0 0 3px rgba(187, 166, 255, 0.9), 0 0 48px 6px rgba(139, 92, 246, 0.55); }
  .marquee {
    height: calc(var(--u) * 64); border-radius: calc(var(--u) * 25); display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom, #3A2F4C 0%, #2A2138 55%, #1C1526 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset;
    font-size: calc(var(--u) * 22); font-weight: 700; text-transform: uppercase; letter-spacing: 0;
  }
  .well { margin-top: calc(var(--u) * 8); padding: calc(var(--u) * 13) calc(var(--u) * 8) calc(var(--u) * 8); border-radius: calc(var(--u) * 25); background: var(--inset); }
  .labels, .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 7); }
  .labels span { text-align: center; font-size: calc(var(--u) * 10); font-weight: 700; letter-spacing: calc(var(--u) * 1.2); text-transform: uppercase; color: var(--muted); padding-bottom: calc(var(--u) * 9); }
  .reel {
    position: relative; height: var(--reel-h); overflow: hidden; border-radius: calc(var(--u) * 14);
    border: 1.5px solid rgba(246, 242, 251, 0.9);
    background: radial-gradient(ellipse 77% 97% at 50% 50%, #FFFFFF 0%, var(--reel-face) 62%, #CFC8DA 100%);
  }
  /* Drum curvature on top of the strip. */
  .reel::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(21,16,29,0.7) 0%, rgba(21,16,29,0.25) 20%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.05) 60%, rgba(21,16,29,0.25) 80%, rgba(21,16,29,0.7) 100%);
  }
  .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .item { height: var(--pitch); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 10); }
  .item img, .item .emoji { width: calc(var(--u) * 78); height: calc(var(--u) * 78); object-fit: contain; }
  .item .emoji { font-size: calc(var(--u) * 58); line-height: calc(var(--u) * 78); text-align: center; }
  .item span { font-size: calc(var(--u) * 14); font-weight: 700; color: var(--ink); text-align: center; padding: 0 4px; }
  /* Veil that fades in at full speed, like the iOS reel: reads as motion blur. */
  .veil { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: var(--reel-face); }
  .reel.pop { animation: pop 0.43s cubic-bezier(0.2, 0.7, 0.3, 1); }
  @keyframes pop { 30% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .hint { margin: -12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  .hint kbd { font: inherit; font-weight: 600; color: var(--text); padding: 1px 7px; border-radius: 6px; border: 1px solid rgba(246,242,251,0.35); }

  /* Apple's official "Laden im App Store" badge, unaltered; 54px tall (min. 40px per Apple). */
  .store { display: inline-block; line-height: 0; border-radius: 10px; transition: transform 0.15s ease, filter 0.15s ease; }
  .store img { height: 54px; width: auto; filter: drop-shadow(0 10px 22px rgba(10, 6, 16, 0.45)); }
  .store:hover { transform: translateY(-1px); }
  .store:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 4px; }

  footer { margin-top: 40px; display: flex; gap: 20px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .cabinet, .reel.pop { transition: none; animation: none; } }
</style>
</head>
<body>
<main>
  <div class="cabinet" id="machine" role="button" tabindex="0" aria-label="Food Slot Machine – neue Kombination drehen">
    <div class="marquee">Food Slot Machine</div>
    <div class="well">
      <div class="labels"><span>Kohlenhydrate</span><span>Protein</span><span>Ballaststoffe</span></div>
      <div class="reels">
        <div class="reel" data-category="carbs"><div class="strip"></div><div class="veil"></div></div>
        <div class="reel" data-category="protein"><div class="strip"></div><div class="veil"></div></div>
        <div class="reel" data-category="fiber"><div class="strip"></div><div class="veil"></div></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint"><kbd>Leertaste</kbd> für eine neue Kombination</p>

  <a class="store" href="https://apps.apple.com/app/food-slot-machine/id6827292049">
    <img src="assets/app-store-badge.svg" alt="Laden im App Store" width="162" height="54">
  </a>
</main>

<footer><a href="https://ferdinands.org">© 2026 Ferdinand Sorg</a><a href="privacy/">Datenschutz</a></footer>

<script src="assets/foods.js"></script>
<script>
  const { foods, avoid } = window.FOOD_SLOT;
  const SLOTS = ['carbs', 'protein', 'fiber'];
  const byCategory = Object.fromEntries(SLOTS.map((c) => [c, foods.filter((f) => f.category === c)]));
  const avoidSet = new Set(avoid.flatMap(([a, b]) => [`${a}|${b}`, `${b}|${a}`]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reels = [...document.querySelectorAll('.reel')];
  const machine = document.getElementById('machine');

  if (matchMedia('(hover: none)').matches) {
    document.getElementById('hint').textContent = 'Tippen für eine neue Kombination';
  }

  const pick = (list, not) => {
    const pool = list.filter((f) => f.id !== not?.id);
    return pool[Math.floor(Math.random() * pool.length)];
  };
  const fits = (m) => !avoidSet.has(`${m[0].id}|${m[1].id}`) && !avoidSet.has(`${m[0].id}|${m[2].id}`) && !avoidSet.has(`${m[1].id}|${m[2].id}`);

  function pickMeal(prev) {
    // Same rule as the app: redraw until no avoided pair lands together.
    let meal;
    for (let i = 0; i < 50; i++) {
      meal = SLOTS.map((c, n) => pick(byCategory[c], prev?.[n]));
      if (fits(meal)) break;
    }
    return meal;
  }

  const itemHtml = (f) =>
    `<div class="item">${f.image ? `<img src="${f.image}" alt="">` : `<div class="emoji">${f.emoji ?? '🍽️'}</div>`}<span>${f.name}</span></div>`;

  // Same motion as the iOS reel (src/components/SlotReel.tsx + spinTiming.ts):
  // pull back, run with quad ease-out past the payline, settle back onto it.
  const BASE_MS = 1100, STAGGER_MS = 450;     // reel n stops after BASE + n * STAGGER
  const BASE_TRAVEL = 8, TRAVEL_STEP = 4;     // and passes at least 8, 12, 16 foods
  const WINDUP_MS = 140, SETTLE_MS = 220;
  const WINDUP = 0.3, OVERSHOOT = 0.18;       // in foods
  const VEIL_FROM = 8, VEIL_TO = 26, VEIL_MAX = 0.6; // foods per second → veil opacity
  const POP_STAGGER_MS = 90;

  const easeInOutQuad = (t) => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
  const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);

  let current = null;
  let spinning = false;

  /** Position (in foods) at time t ms for a reel that travels `travel` foods in `total` ms. */
  function positionAt(t, travel, total) {
    const runMs = Math.max(300, total - WINDUP_MS - SETTLE_MS);
    if (t < WINDUP_MS) return -WINDUP * easeInOutQuad(t / WINDUP_MS);
    t -= WINDUP_MS;
    if (t < runMs) return -WINDUP + (travel + OVERSHOOT + WINDUP) * easeOutQuad(t / runMs);
    t -= runMs;
    return travel + OVERSHOOT - OVERSHOOT * easeOutQuad(Math.min(1, t / SETTLE_MS));
  }

  function place(reel, pos) {
    const strip = reel.querySelector('.strip');
    const pitch = strip.firstElementChild.offsetHeight;
    const offset = (reel.clientHeight - pitch) / 2;
    // Index 0 in the strip is one buffer food above the start (for the pull-back).
    strip.style.transform = `translate3d(0, ${offset - (pos + 1) * pitch}px, 0)`;
  }

  function show(reel, food) {
    reel.querySelector('.strip').innerHTML = itemHtml(pick(byCategory[reel.dataset.category], food)) + itemHtml(food);
    place(reel, 0);
  }

  function runReel(reel, n, from, to) {
    return new Promise((resolve) => {
      const list = byCategory[SLOTS[n]];
      const travel = BASE_TRAVEL + n * TRAVEL_STEP;
      const total = BASE_MS + n * STAGGER_MS;
      const items = [pick(list, from), from];
      for (let i = 1; i < travel; i++) items.push(pick(list, items[items.length - 1]));
      items.push(to, pick(list, to));
      const strip = reel.querySelector('.strip');
      strip.innerHTML = items.map(itemHtml).join('');
      const veil = reel.querySelector('.veil');

      const start = performance.now();
      let lastPos = 0, lastT = start;
      const frame = (now) => {
        const t = now - start;
        const pos = positionAt(t, travel, total);
        place(reel, pos);
        const dt = Math.max(1, now - lastT);
        const speed = (Math.abs(pos - lastPos) / dt) * 1000;
        veil.style.opacity = Math.min(1, Math.max(0, (speed - VEIL_FROM) / (VEIL_TO - VEIL_FROM))) * VEIL_MAX;
        lastPos = pos; lastT = now;
        if (t < total) return requestAnimationFrame(frame);
        veil.style.opacity = 0;
        show(reel, to); // same food at the same spot: no visible jump
        resolve();
      };
      requestAnimationFrame(frame);
    });
  }

  async function spin() {
    if (spinning) return;
    spinning = true;
    machine.classList.remove('glow');
    const next = pickMeal(current);
    if (reduced) {
      reels.forEach((reel, n) => show(reel, next[n]));
    } else {
      await Promise.all(reels.map((reel, n) => runReel(reel, n, current?.[n] ?? pick(byCategory[SLOTS[n]]), next[n])));
    }
    current = next;
    reels.forEach((reel, n) => {
      reel.classList.remove('pop'); void reel.offsetWidth;
      setTimeout(() => reel.classList.add('pop'), n * POP_STAGGER_MS);
    });
    machine.classList.add('glow');
    setTimeout(() => machine.classList.remove('glow'), 1100);
    spinning = false;
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); spin(); }
  });
  machine.addEventListener('click', spin);
  machine.addEventListener('keydown', (e) => { if (e.key === 'Enter') spin(); });

  // Start with a spin once the images are cached.
  Promise.all(foods.filter((f) => f.image).map((f) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = f.image; })))
    .then(() => setTimeout(spin, 250));
  current = SLOTS.map((c) => byCategory[c][0]);
  reels.forEach((reel, n) => show(reel, current[n]));
  addEventListener('resize', () => { if (!spinning) reels.forEach((reel, n) => place(reel, 0)); });
</script>
</body>
</html>
