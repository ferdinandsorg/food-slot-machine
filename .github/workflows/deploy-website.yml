# Uploads docs/ (landing page + privacy policy) to the Food Slot folder on the web server via SFTP
# (the host has plain FTP disabled). Runs on every push to main that touches docs/, or by hand
# from the Actions tab. The account is scoped to the Food Slot folder, so the target is its root.
# Nothing is ever deleted on the server; files are only added or replaced.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only connect and list what would change, upload nothing'
        type: boolean
        default: true

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload docs/ via SFTP
        run: |
          MIRROR_FLAGS="--reverse --verbose --only-newer --no-perms --exclude-glob .DS_Store"
          if [ "$DRY_RUN" = "true" ]; then MIRROR_FLAGS="$MIRROR_FLAGS --dry-run"; fi
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            echo '--- remote folder:'; pwd; cls -1;
            echo '--- mirror (dry run: $DRY_RUN):';
            mirror $MIRROR_FLAGS ./docs/ ./;
            bye"
